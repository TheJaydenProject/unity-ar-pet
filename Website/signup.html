<!--
    Author: Jayden Wong
    Date: 13 December 2025
    User registration page for PawPalAR. Creates new Firebase Auth accounts and
    initializes user database profiles with default stats. Features form validation,
    error handling with shake animations, and user-friendly error messages for
    common registration issues.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PawPalAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./js/config.js"></script>
    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .animate-shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<body class="bg-surface flex items-center justify-center min-h-screen p-4 font-sans text-textPrimary">

    <div id="signupCard" class="w-full max-w-md bg-surfaceContainer/90 backdrop-blur-xl p-8 rounded-[32px] shadow-lg border border-white/20 relative overflow-hidden transition-all">
        
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-primary/10 rounded-full blur-2xl pointer-events-none"></div>

        <div class="text-center mb-6 relative z-10">
            <h1 class="text-3xl font-bold text-primary mb-2">Join the Pack</h1>
            <p class="text-textSecondary">Create your caretaker profile.</p>
        </div>

        <div id="errorBanner" class="hidden mb-6 bg-red-100 border-l-4 border-red-500 text-red-900 p-4 rounded-r shadow-sm flex items-start gap-3 relative z-10">
            <div class="text-xl">⚠️</div>
            <div>
                <p class="font-bold text-sm">Registration Failed</p>
                <p id="errorText" class="text-sm">Error details here.</p>
            </div>
        </div>

        <form id="signupForm" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-bold text-textSecondary mb-1 ml-1">Caretaker Name</label>
                <input type="text" id="displayName" required
                    class="w-full px-4 py-3 bg-surfaceLow/50 rounded-t-xl rounded-b-md border-b-2 border-outline focus:border-primary focus:outline-none focus:bg-white/50 transition-colors placeholder-textSecondary/30"
                    placeholder="e.g. DogLover99">
            </div>

            <div>
                <label class="block text-sm font-bold text-textSecondary mb-1 ml-1">Email</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 bg-surfaceLow/50 rounded-t-xl rounded-b-md border-b-2 border-outline focus:border-primary focus:outline-none focus:bg-white/50 transition-colors placeholder-textSecondary/30"
                    placeholder="name@example.com">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-textSecondary mb-1 ml-1">Password</label>
                <input type="password" id="password" required minlength="6"
                    class="w-full px-4 py-3 bg-surfaceLow/50 rounded-t-xl rounded-b-md border-b-2 border-outline focus:border-primary focus:outline-none focus:bg-white/50 transition-colors placeholder-textSecondary/30"
                    placeholder="Min. 6 characters">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-primary text-onPrimary font-bold py-3.5 rounded-full shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all flex items-center justify-center gap-2">
                <span>Create Account</span>
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-textSecondary relative z-10">
            Already have an account? <a href="index.html" class="font-bold text-primary hover:underline">Log In</a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './js/config.js';
        import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { ref, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const form = document.getElementById('signupForm');
        const btn = document.getElementById('submitBtn');
        const errorBanner = document.getElementById('errorBanner');
        const errorText = document.getElementById('errorText');
        const card = document.getElementById('signupCard');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset UI
            errorBanner.classList.add('hidden');
            card.classList.remove('animate-shake');
            
            // 1. Get Values
            const name = document.getElementById('displayName').value.trim();
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;

            if (!name) {
                showError("Please enter a Caretaker name.");
                return;
            }

            // UI Loading State
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = `<span class="animate-spin text-xl">🐾</span> Creating...`;

            try {
                // 2. Create Auth User
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 3. Update Auth Profile (DisplayName)
                await updateProfile(user, { displayName: name });

                // 4. Initialize new user's database profile with default stats
                await set(ref(db, 'users/' + user.uid + '/profile'), {
                    displayName: name,
                    email: email,
                    highestAffection: 0,
                    totalGamesPlayed: 0,
                    createdAt: Math.floor(Date.now() / 1000),
                    userId: user.uid
                });

                // 5. Success & Redirect
                window.location.href = 'leaderboard.html';

            } catch (error) {
                let msg = "Something went wrong.";
                if (error.code === 'auth/email-already-in-use') msg = "That email is already in the pack! Try logging in.";
                if (error.code === 'auth/weak-password') msg = "Password is too weak. Try adding more characters.";
                if (error.code === 'auth/invalid-email') msg = "That email address doesn't look right.";
                
                showError(msg);
                
                // Reset Button
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
            }
        });

        function showError(msg) {
            errorText.innerText = msg;
            errorBanner.classList.remove('hidden');
            card.classList.add('animate-shake');
        }
    </script>
</body>
</html>
