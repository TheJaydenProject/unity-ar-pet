<!--
    Author: Jayden Wong
    Date: 13 December 2025
    Login page for PawPalAR. Handles user authentication with Firebase Auth.
    Features include error handling with user-friendly messages, shake animation
    on failed attempts, and guest access option to view leaderboard without login.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PawPalAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./js/config.js"></script>
    <style>
        /* Custom Shake Animation for Errors */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        .animate-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
    </style>
</head>
<body class="bg-surface flex items-center justify-center min-h-screen p-4">

    <div id="loginCard" class="w-full max-w-md bg-surfaceContainer/80 backdrop-blur-xl p-8 rounded-[32px] shadow-lg border border-white/20 transition-all">
        
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-primary mb-2">Welcome Back!</h1>
            <p class="text-textSecondary">Manage your PawPal stats.</p>
        </div>

        <div id="errorBanner" class="hidden mb-6 bg-red-100 border-l-4 border-red-500 text-red-900 p-4 rounded-r shadow-sm flex items-start gap-3">
            <div class="text-xl">⚠️</div>
            <div>
                <p class="font-bold text-sm">Login Failed</p>
                <p id="errorText" class="text-sm">Invalid credentials.</p>
            </div>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-textSecondary mb-1 ml-1">Email</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 bg-surfaceLow/50 rounded-t-xl rounded-b-md border-b-2 border-outline focus:border-primary focus:outline-none focus:bg-white/50 transition-colors"
                    placeholder="name@example.com">
            </div>
            
            <div>
                <label class="block text-sm font-bold text-textSecondary mb-1 ml-1">Password</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 bg-surfaceLow/50 rounded-t-xl rounded-b-md border-b-2 border-outline focus:border-primary focus:outline-none focus:bg-white/50 transition-colors"
                    placeholder="••••••••">
                <div class="text-right mt-1">
                    <a href="forgot.html" class="text-xs font-bold text-primary hover:underline">Forgot password?</a>
                </div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-primary text-onPrimary font-bold py-3.5 rounded-full shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all">
                Sign In
            </button>
        </form>

        <div class="mt-8 text-center text-sm text-textSecondary">
            New to PawPal? <a href="signup.html" class="font-bold text-primary hover:underline">Create Account</a>
        </div>
        
        <div class="mt-4 text-center">
             <a href="leaderboard.html" class="text-xs text-outline hover:text-primary transition-colors">View Leaderboard as Guest</a>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const loginForm = document.getElementById('loginForm');
        const errorBanner = document.getElementById('errorBanner');
        const errorText = document.getElementById('errorText');
        const loginCard = document.getElementById('loginCard');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset UI
            errorBanner.classList.add('hidden');
            loginCard.classList.remove('animate-shake');
            submitBtn.disabled = true;
            submitBtn.innerText = "Checking...";

            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;

            try {
                await signInWithEmailAndPassword(auth, email, pass);
                window.location.href = 'leaderboard.html';
            } catch (error) {

                let msg = "Something went wrong. Please check your connection.";

                // Map Firebase error codes to user-friendly messages
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    msg = "We couldn't find a user with that email and password combination.";
                } else if (error.code === 'auth/too-many-requests') {
                    msg = "Too many failed attempts. Please try again later.";
                }

                errorText.innerText = msg;
                errorBanner.classList.remove('hidden');
                
                loginCard.classList.add('animate-shake');
                
                submitBtn.disabled = false;
                submitBtn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
