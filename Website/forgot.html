<!--
    Author: Jayden Wong
    Date: 13 December 2025
    Password reset page for PawPalAR. Handles Firebase password reset email
    requests. Implements security best practice by always showing success message
    regardless of whether email exists, preventing email enumeration attacks.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PawPalAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./js/config.js"></script>
</head>
<body class="bg-surface flex items-center justify-center min-h-screen p-4 font-sans text-textPrimary">

    <div class="w-full max-w-md bg-surfaceContainer/90 backdrop-blur-xl p-8 rounded-[32px] shadow-lg border border-white/20">
        
        <div class="text-center mb-6">
            <div class="text-4xl mb-2">🦴</div>
            <h1 class="text-2xl font-bold text-primary mb-2">Forgot Password?</h1>
            <p class="text-textSecondary text-sm">Enter your email and we'll send you a link to get back to your pet.</p>
        </div>

        <form id="resetForm" class="space-y-6">
            <div>
                <label class="block text-sm font-bold text-textSecondary mb-1 ml-1">Email Address</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 bg-surfaceLow/50 rounded-t-xl rounded-b-md border-b-2 border-outline focus:border-primary focus:outline-none focus:bg-white/50 transition-colors placeholder-textSecondary/30"
                    placeholder="name@example.com">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-primary text-onPrimary font-bold py-3.5 rounded-full shadow-md hover:shadow-lg hover:-translate-y-0.5 active:scale-95 transition-all">
                Send Reset Link
            </button>
        </form>

        <div id="successMsg" class="hidden mt-6 bg-green-100 text-green-800 p-4 rounded-2xl text-sm text-center border border-green-200 animate-fade-in">
            <span class="font-bold">Check your inbox!</span><br>
            If an account exists for that email, we've sent instructions.
        </div>

        <div class="mt-8 text-center">
            <a href="index.html" class="text-sm font-bold text-outline hover:text-primary transition-colors flex items-center justify-center gap-1">
                <span><</span> Back to Login
            </a>
        </div>
    </div>

    <script type="module">
        import { auth } from './js/config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { showToast } from './js/ui.js';

        const form = document.getElementById('resetForm');
        const btn = document.getElementById('submitBtn');
        const successDiv = document.getElementById('successMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            btn.disabled = true;
            btn.classList.add('opacity-70', 'cursor-not-allowed');
            btn.innerText = "Sending...";

            try {
                await sendPasswordResetEmail(auth, email);
                
                // Always show success message to prevent email enumeration attacks
                form.classList.add('hidden');
                successDiv.classList.remove('hidden');
                
            } catch (error) {
                console.error(error);
                let msg = "Failed to send reset email.";
                if (error.code === 'auth/user-not-found') {
                    // Security best practice: Don't reveal if user exists, 
                    // but for this project scope, we might show a generic error 
                    // or just pretend it worked (which is safer).
                    // We will just show the success message anyway to prevent email enumeration.
                    form.classList.add('hidden');
                    successDiv.classList.remove('hidden');
                    return; 
                }
                if (error.code === 'auth/invalid-email') msg = "Invalid email address.";
                
                showToast(msg, 'error');
                btn.disabled = false;
                btn.classList.remove('opacity-70', 'cursor-not-allowed');
                btn.innerText = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
